<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        @page {
            size: 3in 2in;
            margin: 0;
        }
        body {
            margin: 0;
            padding: 0;
            width: 3in;
            height: 2in;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            border: 2px solid black;
            box-sizing: border-box;
        }
        h1 {
            font-size: 32px;
            margin: 10px 0;
        }
        p {
            font-size: 16px;
            margin: 5px 0;
        }
        .time {
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <h1>PRUEBA</h1>
    <p>Badge de Prueba</p>
    <p class="time" id="time"></p>
    <script>
        document.getElementById('time').textContent = new Date().toLocaleTimeString();
    </script>
</body>
</html>
