<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AWSpectrum Gamified PWA</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0D0D12">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="styles.css">
    
    <!-- Three.js (Import Map for ES Modules) -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.158.0/build/three.module.js"
        }
      }
    </script>

    <style>
        /* Background Canvas Layer */
        #bg-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -1;
            pointer-events: none;
        }
    </style>
</head>
<body data-theme="dark">

    <canvas id="bg-canvas"></canvas>

    <div id="app-container">
        <!-- SPA Views will be injected here by router.js -->
    </div>

    <div id="nav-container">
        <!-- Bottom Tab Bars will be injected here -->
    </div>

    <div id="modals-container">
        <!-- Modals will be injected here -->
    </div>

    <!-- Main ES Module Entry Point -->
    <script type="module" src="js/main.js"></script>

</body>
</html>
