AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Sistema de Registro MeetUp - Generación automática de badges

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs18.x
    MemorySize: 512
    Environment:
      Variables:
        BADGE_BUCKET: !Ref BadgeBucket
        ATTENDEES_TABLE: !Ref AttendeesTable
    Tags:
      Project: RegistroMeetUp
      Environment: Production

Resources:
  # S3 Bucket para badges generados
  BadgeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-badges'
      Tags:
        - Key: Project
          Value: RegistroMeetUp
        - Key: Purpose
          Value: BadgeStorage
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: false
        IgnorePublicAcls: true
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - '*'
            AllowedMethods:
              - GET
            AllowedHeaders:
              - '*'

  # Política para bucket de badges
  BadgeBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BadgeBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: 's3:GetObject'
            Resource: !Sub '${BadgeBucket.Arn}/*'

  # S3 Bucket para frontend
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-frontend'
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      Tags:
        - Key: Project
          Value: RegistroMeetUp
        - Key: Purpose
          Value: Frontend

  # Política para bucket de frontend
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: 's3:GetObject'
            Resource: !Sub '${FrontendBucket.Arn}/*'

  # DynamoDB para registro de asistentes
  AttendeesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-attendees'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: badgeId
          AttributeType: S
        - AttributeName: email
          AttributeType: S
        - AttributeName: username
          AttributeType: S
        - AttributeName: eventId
          AttributeType: S
      KeySchema:
        - AttributeName: badgeId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: EmailIndex
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: UsernameIndex
          KeySchema:
            - AttributeName: username
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: EventIdIndex
          KeySchema:
            - AttributeName: eventId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: RegistroMeetUp
        - Key: Purpose
          Value: AttendeeRegistry

  # DynamoDB para eventos
  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-events'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH
      Tags:
        - Key: Project
          Value: RegistroMeetUp
        - Key: Purpose
          Value: EventRegistry

  # API Gateway
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,PUT,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key'"
        AllowOrigin: "'*'"
      Tags:
        Project: RegistroMeetUp
        Purpose: API

  # Lambda: Profile Scraper
  ProfileScraperFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-scraper'
      CodeUri: ../lambda/scraper/
      Handler: index.handler
      Timeout: 90
      MemorySize: 3008
      Events:
        ScrapeProfile:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /scrape
            Method: POST

  # Lambda: Badge Generator
  BadgeGeneratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-badge-generator'
      CodeUri: ../lambda/badge-generator/
      Handler: index.handler
      Environment:
        Variables:
          PRINT_QUEUE_URL: !Ref PrintQueue
          EVENTS_TABLE: !Ref EventsTable
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref BadgeBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref AttendeesTable
        - DynamoDBReadPolicy:
            TableName: !Ref EventsTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt PrintQueue.QueueName
      Events:
        GenerateBadge:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /generate-badge
            Method: POST

  # Lambda: Print Service
  PrintServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-print-service'
      CodeUri: ../lambda/print-service/
      Handler: index.handler
      Environment:
        Variables:
          PRINT_QUEUE_URL: !Ref PrintQueue
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt PrintQueue.QueueName
      Events:
        PrintBadge:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /print
            Method: POST

  # Lambda: Stats Service
  StatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-stats'
      CodeUri: ../lambda/stats/
      Handler: index.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref AttendeesTable
      Events:
        GetStats:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /stats
            Method: GET

  # Lambda: Profile Lookup Service
  ProfileLookupFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-profile-lookup'
      CodeUri: ../lambda/profile-lookup/
      Handler: index.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref AttendeesTable
      Events:
        LookupProfile:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /profile-lookup
            Method: POST

  # Lambda: Event Manager
  EventManagerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-event-manager'
      CodeUri: ../lambda/event-manager/
      Handler: index.handler
      Environment:
        Variables:
          EVENTS_TABLE: !Ref EventsTable
          ATTENDEES_TABLE: !Ref AttendeesTable
          SES_FROM_EMAIL: 'hector.martinez.telecom@gmail.com'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AttendeesTable
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: '*'
      Events:
        CreateEvent:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events
            Method: POST
        GetActiveEvent:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/active
            Method: GET
        EndEvent:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/end
            Method: PUT
        GetEventReport:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/report
            Method: GET
        SendEventReport:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /events/{eventId}/send-report
            Method: POST

  # Lambda: Attendee Import (Meetup + Eventbrite)
  AttendeeImportFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-attendee-import'
      CodeUri: ../lambda/attendee-import/
      Handler: index.handler
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          EVENTS_TABLE: !Ref EventsTable
          ATTENDEES_TABLE: !Ref AttendeesTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AttendeesTable
      Events:
        ImportMeetup:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /import/meetup
            Method: POST
        ImportMeetupManual:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /import/meetup-manual
            Method: POST
        ImportEventbrite:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /import/eventbrite
            Method: POST
        ImportStatus:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /import/status/{eventId}
            Method: GET
        ImportPreregistered:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /import/preregistered/{eventId}
            Method: GET
        ImportCheckin:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /import/checkin
            Method: POST
        ImportCSV:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /import/csv
            Method: POST

  # SQS Queue para cola de impresión
  PrintQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-print-queue'
      VisibilityTimeout: 300
      MessageRetentionPeriod: 3600
      Tags:
        - Key: Project
          Value: RegistroMeetUp
        - Key: Purpose
          Value: PrintQueue

  # CloudFront Distribution para HTTPS
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Registro MeetUp - Frontend Distribution
        DefaultRootObject: registration-station.html
        Origins:
          - Id: S3Origin
            DomainName: !Select [2, !Split ["/", !GetAtt FrontendBucket.WebsiteURL]]
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: http-only
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: true
            Cookies:
              Forward: none
          MinTTL: 0
          DefaultTTL: 300
          MaxTTL: 600
        PriceClass: PriceClass_100
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
      Tags:
        - Key: Project
          Value: RegistroMeetUp

Outputs:
  ApiUrl:
    Description: URL de la API Gateway
    Value: !Sub 'https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/prod'
  
  CloudFrontUrl:
    Description: URL HTTPS de CloudFront (USAR ESTA)
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'
  
  RegistrationStationUrl:
    Description: URL de la estación de registro con HTTPS
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}/registration-station.html'
  
  FrontendUrl:
    Description: URL del sitio web (HTTP - solo para referencia)
    Value: !GetAtt FrontendBucket.WebsiteURL
  
  BadgeBucketName:
    Description: Nombre del bucket de badges
    Value: !Ref BadgeBucket
  
  FrontendBucketName:
    Description: Nombre del bucket del frontend
    Value: !Ref FrontendBucket
  
  PrintQueueUrl:
    Description: URL de la cola de impresión
    Value: !Ref PrintQueue
